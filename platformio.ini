[platformio]
default_envs = esp32c3-wrist

[env]
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
extra_scripts = pre:scratch/build_html_pre.py

[env:esp32c3]
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D I2C_SDA=8
    -D I2C_SCL=9

[env:esp32c3-wrist]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -D SENSOR_POINT_ID=0 -D SENSOR_SIDE_ID=0

[env:esp32c3-right-forearm]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -D SENSOR_POINT_ID=1 -D SENSOR_SIDE_ID=2

[env:esp32c3-left-forearm]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -D SENSOR_POINT_ID=2 -D SENSOR_SIDE_ID=1

[env:esp32c3-right-upper-arm]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -D SENSOR_POINT_ID=3 -D SENSOR_SIDE_ID=2

[env:esp32c3-left-upper-arm]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -D SENSOR_POINT_ID=4 -D SENSOR_SIDE_ID=1

[env:esp32c3-chest]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -D SENSOR_POINT_ID=5 -D SENSOR_SIDE_ID=0

[env:esp32c3-neck]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -D SENSOR_POINT_ID=6 -D SENSOR_SIDE_ID=0

[env:esp32c3-shoulder]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -D SENSOR_POINT_ID=14 -D SENSOR_SIDE_ID=0

[env:esp32c3-elbow]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -D SENSOR_POINT_ID=15 -D SENSOR_SIDE_ID=0
