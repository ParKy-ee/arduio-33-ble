[platformio]
default_envs = nano33ble

[env]
platform = nordicnrf52
board = nano33ble
framework = arduino
monitor_speed = 115200
build_flags =
    -D SENSOR_POINT=chest

; Select the environment that matches the IMU on the physical board.
[env:nano33ble]
lib_deps =
    arduino-libraries/Arduino_LSM9DS1
    arduino-libraries/ArduinoBLE

[env:nano33ble_rev2]
build_flags =
    ${env.build_flags}
    -D IMU_REV2
lib_deps =
    arduino-libraries/Arduino_BMI270_BMM150
    arduino-libraries/ArduinoBLE
